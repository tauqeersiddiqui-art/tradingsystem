[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    slow: takes more than ~10s (deselect with '-m "not slow"')
    needs_secrets: requires broker credentials / TOTP; never run in CI
    needs_realdata: requires true volume or per-strike premium history (see issues)
filterwarnings =
    ignore::DeprecationWarning
    ignore::RuntimeWarning
