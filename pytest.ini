[pytest]
python_files = test_*.py *_test.py tests.py
python_classes = Test*
python_functions = test_*
addopts = -p no:cacheprovider

# NOTE on tests/regression/_phase*.py:
#   Those are script-style harnesses (module-level `sys.exit`, no __main__
#   guard) and are run directly:  python tests/regression/_phase1_verify.py
#   They are excluded from pytest *collection* intentionally so that pytest
#   never imports them and triggers their module-level exit.  They remain the
#   documented regression suite and are executed by pytest.ini-backed scripts
#   (see tests/regression/README.md).