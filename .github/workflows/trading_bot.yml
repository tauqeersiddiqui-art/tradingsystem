name: Zerodha Trading Bot

# ──────────────────────────────────────────────────────────────────────
# Schedule: Mon–Fri at 4:05 AM UTC = 9:35 AM IST
#
# Why 9:35 AM IST instead of 9:00 AM IST?
#   GitHub Actions jobs are capped at 6 hours on GitHub.com.
#   9:00 AM → 3:35 PM IST = 6h35m (over the limit).
#   9:35 AM → 3:35 PM IST = exactly 6h (fits perfectly).
#   master_runner.py has built-in ORB reconstruction from Zerodha's
#   historical API, so late starts work fine — it reconstructs the
#   9:15–9:29 AM candles automatically on startup.
# ──────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '5 4 * * 1-5'   # 4:05 AM UTC = 9:35 AM IST, Mon–Fri
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 360      # GitHub.com hard cap — matches our 9:35→3:35 window

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3. Create runtime directories ────────────────────────────────
      - name: Create runtime directories
        run: mkdir -p logs data/historical

      # ── 4. Write .env from GitHub Secrets ────────────────────────────
      # Go to: repo → Settings → Secrets → Actions → New repository secret
      # Add each secret listed below (copy values from your local .env)
      - name: Write .env from secrets
        env:
          KITE_API_KEY:          ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET:       ${{ secrets.KITE_API_SECRET }}
          KITE_USER_ID:          ${{ secrets.KITE_USER_ID }}
          KITE_PASSWORD:         ${{ secrets.KITE_PASSWORD }}
          KITE_TOTP_SECRET:      ${{ secrets.KITE_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID:  ${{ secrets.TELEGRAM_BOT_CHAT_ID }}
          TELEGRAM_CHANNEL_ID:   ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_ID:     ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          {
            echo "KITE_API_KEY=$KITE_API_KEY"
            echo "KITE_API_SECRET=$KITE_API_SECRET"
            echo "KITE_USER_ID=$KITE_USER_ID"
            echo "KITE_PASSWORD=$KITE_PASSWORD"
            echo "KITE_TOTP_SECRET=$KITE_TOTP_SECRET"
            echo "KITE_ACCESS_TOKEN="
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "TELEGRAM_BOT_CHAT_ID=$TELEGRAM_BOT_CHAT_ID"
            echo "TELEGRAM_CHANNEL_ID=$TELEGRAM_CHANNEL_ID"
            echo "TELEGRAM_ADMIN_ID=$TELEGRAM_ADMIN_ID"
            echo "PAPER_MODE=0"
            echo "DRY_RUN=1"
            echo "TEST_MODE=0"
            echo "INITIAL_CAPITAL=100000"
            echo "MAX_RISK_PER_TRADE_PCT=0.01"
            echo "MAX_LOTS_CAP=10"
            echo "ML_ON=1"
            echo "CHAMPION_THRESHOLD=0.40"
          } > .env

      # ── 5. Headless login — auto-generates TOTP, no phone needed ─────
      - name: Zerodha headless login (auto-TOTP)
        run: python login_headless.py

      # ── 6. Run trading engine until 3:35 PM IST ──────────────────────
      # Dynamic timeout: calculates seconds remaining until 15:35 IST.
      # If startup is delayed, SECS shrinks automatically.
      # master_runner sends EOD summary at 15:30 then continues looping —
      # `timeout --signal=SIGINT` triggers a clean KeyboardInterrupt exit.
      - name: Run trading engine
        run: |
          SECS=$(python - <<'EOF'
          from datetime import datetime, timezone, timedelta
          ist = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(ist)
          stop = now.replace(hour=15, minute=35, second=0, microsecond=0)
          secs = max(60, int((stop - now).total_seconds()))
          print(secs)
          EOF
          )
          echo "Trading for ${SECS}s (until 15:35 IST)"
          timeout --signal=SIGINT "$SECS" python master_runner.py || true
